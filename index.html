<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clínica</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root { --nude:#F7EBE5; --areia:#E9D3C9; --rosa:#C4677F; --rosa-esc:#A94F68; --vinho:#4A2530; --branco:#FFFDFC; }
* { box-sizing: border-box }
body { margin:0; background:var(--nude); color:var(--vinho); font:16px/1.5 'Nunito Sans', system-ui, sans-serif }
h1, h2 { font-family:'Cormorant Garamond', Georgia, serif; font-weight:600; margin:0 0 16px }
h1 { font-size:2rem } h2 { font-size:1.6rem }
.app { display:grid; grid-template-columns:240px 1fr; min-height:100vh }
.menu { background:var(--branco); border-right:1px solid var(--areia); padding:24px 16px; display:flex; flex-direction:column; gap:4px }
.menu button { text-align:left; background:none; color:var(--vinho); border:0; padding:10px 12px; border-radius:8px; cursor:pointer; font:inherit }
.menu button:hover { background:var(--nude) }
.menu button.ativo { background:var(--rosa); color:#fff }
.menu .sair { margin-top:auto; color:var(--rosa-esc) }
main { padding:32px; max-width:980px }
input { font:inherit; padding:10px 12px; border:1px solid var(--areia); border-radius:8px; background:#fff; color:var(--vinho) }
button { font:inherit; background:var(--rosa); color:#fff; border:0; padding:10px 16px; border-radius:8px; cursor:pointer }
button:hover { background:var(--rosa-esc) }
button.leve { background:var(--areia); color:var(--vinho) }
:focus-visible { outline:3px solid var(--rosa-esc); outline-offset:2px }
.cartao { background:var(--branco); border:1px solid var(--areia); border-radius:12px; padding:16px; margin-bottom:12px }
.form { display:flex; flex-wrap:wrap; gap:10px; align-items:center }
.linha { display:flex; justify-content:space-between; align-items:center }
.vazio { color:#8a6a72 } .erro { color:#b3261e; margin:0 }
.login { max-width:340px; margin:12vh auto; display:flex; flex-direction:column; gap:12px; padding:0 16px }
main { max-width:1240px }
select { font:inherit; padding:10px 12px; border:1px solid var(--areia); border-radius:8px; background:#fff; color:var(--vinho) }
.semana { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px }
.dia { background:var(--branco); border:1px solid var(--areia); border-radius:12px; padding:10px; min-height:120px }
.dia h3 { margin:0 0 8px; font:600 1.1rem 'Cormorant Garamond', Georgia, serif; text-transform:capitalize }
.atend { background:var(--nude); border-radius:8px; padding:8px; margin-bottom:8px; font-size:.92rem }
.atend select { width:100%; margin-top:6px; padding:4px 6px; font-size:.85rem }
.atend.apagado { opacity:.5; text-decoration:line-through }
textarea { font:inherit; padding:10px 12px; border:1px solid var(--areia); border-radius:8px; background:#fff; color:var(--vinho); width:100% }
.clicavel { cursor:pointer } .clicavel:hover { border-color:var(--rosa) }
.cartao.apagado { opacity:.55 }
.retorno { padding:10px 0; border-top:1px solid var(--areia); gap:12px; flex-wrap:wrap }
a.botao { background:var(--areia); color:var(--vinho); text-decoration:none; padding:10px 16px; border-radius:8px }
label { display:inline-flex; gap:6px; align-items:center }
.resumo { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px }
.numero { font:600 1.7rem 'Cormorant Garamond', Georgia, serif }
@media (max-width:760px) { .app { grid-template-columns:1fr } .menu { flex-direction:row; flex-wrap:wrap; border-right:0; border-bottom:1px solid var(--areia) } .menu h2 { width:100% } main { padding:20px } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="text/babel">
// ====== CONFIGURAÇÃO: cole aqui os dados do seu Supabase (Project Settings > API) ======
const SUPABASE_URL = 'https://qyzyczyfucerqxhffgjm.supabase.co'        // ex.: https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY = 'sb_publishable_govM7LdQaURB3aC3W9xz3g_coSt4HQU' // chave "anon public"
// ========================================================================================

const { useState, useEffect } = React
const configurado = !SUPABASE_URL.includes('COLE_AQUI') && !SUPABASE_ANON_KEY.includes('COLE_AQUI')
const db = configurado ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null

// [chave, rótulo, somenteAdmin]
const MENU = [
  ['painel', 'Painel'], ['agenda', 'Agenda'], ['clientes', 'Clientes'],
  ['financeiro', 'Financeiro', true], ['compras', 'Compras', true],
  ['pacotes', 'Pacotes e fidelidade', true], ['relatorios', 'Relatórios', true],
  ['admin', 'Administrativo', true],
]

function Login() {
  const [email, setEmail] = useState('')
  const [senha, setSenha] = useState('')
  const [erro, setErro] = useState('')
  const entrar = async () => {
    const { error } = await db.auth.signInWithPassword({ email, password: senha })
    if (error) setErro('E-mail ou senha incorretos. Confira e tente de novo.')
  }
  return (
    <div className="login">
      <h1>Entrar na clínica</h1>
      <input placeholder="E-mail" value={email} onChange={e => setEmail(e.target.value)} />
      <input placeholder="Senha" type="password" value={senha} onChange={e => setSenha(e.target.value)} />
      {erro && <p className="erro">{erro}</p>}
      <button onClick={entrar}>Entrar</button>
    </div>
  )
}

const vazioUnidade = { nome: '', endereco: '', telefone: '', cor: '#C4677F' }

function Unidades() {
  const [lista, setLista] = useState([])
  const [form, setForm] = useState(vazioUnidade)
  const carregar = async () => {
    const { data } = await db.from('unidades').select('*').order('nome')
    setLista(data || [])
  }
  useEffect(() => { carregar() }, [])
  const salvar = async () => {
    if (!form.nome.trim()) return
    await db.from('unidades').insert(form)
    setForm(vazioUnidade); carregar()
  }
  const salvarHorario = async (u, k, v) => {
    await db.from('unidades').update({ horario_funcionamento: { ...u.horario_funcionamento, [k]: v } }).eq('id', u.id)
    carregar()
  }
  const alternar = async u => {
    await db.from('unidades').update({ ativa: !u.ativa }).eq('id', u.id)
    carregar()
  }
  const campo = k => e => setForm({ ...form, [k]: e.target.value })
  return (
    <>
      <h1 style={{ marginTop: 32 }}>Unidades</h1>
      <div className="cartao form">
        <input placeholder="Nome da unidade" value={form.nome} onChange={campo('nome')} />
        <input placeholder="Endereço" value={form.endereco} onChange={campo('endereco')} />
        <input placeholder="Telefone / WhatsApp" value={form.telefone} onChange={campo('telefone')} />
        <label>Cor na agenda <input type="color" value={form.cor} onChange={campo('cor')} /></label>
        <button onClick={salvar}>Salvar unidade</button>
      </div>
      {lista.length === 0 && <p className="vazio">Nenhuma unidade cadastrada. Cadastre a primeira acima.</p>}
      {lista.map(u => (
        <div key={u.id} className="cartao linha" style={{ borderLeft: `6px solid ${u.cor}` }}>
          <div><strong>{u.nome}</strong><br /><small>{u.endereco} {u.telefone}</small><br />
            <small>Funciona das <input type="time" style={{ padding: 4 }} defaultValue={u.horario_funcionamento?.abre || ''} onBlur={e => salvarHorario(u, 'abre', e.target.value)} /> às{' '}
              <input type="time" style={{ padding: 4 }} defaultValue={u.horario_funcionamento?.fecha || ''} onBlur={e => salvarHorario(u, 'fecha', e.target.value)} /></small></div>
          <button className="leve" onClick={() => alternar(u)}>{u.ativa ? 'Desativar' : 'Reativar'}</button>
        </div>
      ))}
    </>
  )
}

const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
const fmtHora = d => new Date(d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
const somaDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x }
const inicioSemana = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return somaDias(x, -((x.getDay() + 6) % 7)) }
const isoData = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
const ROTULO = { agendado: 'Agendado', confirmado: 'Confirmado', concluido: 'Concluído', cancelado: 'Cancelado', faltou: 'Faltou' }

function Sel({ valor, onChange, opcoes, vazio }) {
  return (
    <select value={valor} onChange={e => onChange(e.target.value)}>
      <option value="">{vazio}</option>
      {opcoes.map(([id, rotulo]) => <option key={id} value={id}>{rotulo}</option>)}
    </select>
  )
}

function Servicos() {
  const [lista, setLista] = useState([])
  const [f, setF] = useState({ nome: '', preco: '', duracao_min: 60, retorno_dias: '' })
  const carregar = async () => { const { data } = await db.from('servicos').select('*').order('nome'); setLista(data || []) }
  useEffect(() => { carregar() }, [])
  const salvar = async () => {
    if (!f.nome.trim()) return
    await db.from('servicos').insert({ nome: f.nome, preco: Number(f.preco) || 0, duracao_min: Number(f.duracao_min) || 60, retorno_dias: Number(f.retorno_dias) || null })
    setF({ nome: '', preco: '', duracao_min: 60, retorno_dias: '' }); carregar()
  }
  const alternar = async s => { await db.from('servicos').update({ ativo: !s.ativo }).eq('id', s.id); carregar() }
  return (
    <>
      <h1 style={{ marginTop: 32 }}>Serviços</h1>
      <div className="cartao form">
        <input placeholder="Nome (ex.: Design de sobrancelha)" value={f.nome} onChange={e => setF({ ...f, nome: e.target.value })} />
        <input type="number" placeholder="Preço (R$)" value={f.preco} onChange={e => setF({ ...f, preco: e.target.value })} />
        <input type="number" placeholder="Duração (min)" value={f.duracao_min} onChange={e => setF({ ...f, duracao_min: e.target.value })} />
        <input type="number" placeholder="Chamar de novo após (dias)" value={f.retorno_dias} onChange={e => setF({ ...f, retorno_dias: e.target.value })} />
        <button onClick={salvar}>Salvar serviço</button>
      </div>
      {lista.length === 0 && <p className="vazio">Nenhum serviço cadastrado. Cadastre o primeiro acima.</p>}
      {lista.map(s => (
        <div key={s.id} className="cartao linha">
          <div><strong>{s.nome}</strong><br /><small>{brl(s.preco)} · {s.duracao_min} min</small><br />
            <small>Chamar de novo após <input type="number" style={{ width: 70, padding: 4 }} defaultValue={s.retorno_dias || ''} placeholder="dias"
              onBlur={e => db.from('servicos').update({ retorno_dias: Number(e.target.value) || null }).eq('id', s.id)} /> dias</small></div>
          <button className="leve" onClick={() => alternar(s)}>{s.ativo ? 'Desativar' : 'Reativar'}</button>
        </div>
      ))}
    </>
  )
}

const vazioCliente = { nome: '', telefone: '', email: '', nascimento: '', cpf: '', endereco: '', como_conheceu: '', alergias: '', observacoes: '' }
const dataBr = d => new Date(d).toLocaleDateString('pt-BR')

function Historico({ cliente, admin, onVoltar, onEditar }) {
  const [itens, setItens] = useState([])
  useEffect(() => {
    db.from('agendamentos').select('*, servicos(nome), usuarios(nome), unidades(nome,cor)')
      .eq('cliente_id', cliente.id).order('inicio', { ascending: false }).then(({ data }) => setItens(data || []))
  }, [cliente.id])
  const concluidos = itens.filter(i => i.status === 'concluido')
  const proximo = [...itens].reverse().find(i => ['agendado', 'confirmado'].includes(i.status) && new Date(i.inicio) > new Date())
  return (
    <>
      <button className="leve" onClick={onVoltar}>Voltar para a lista</button>
      <h1 style={{ marginTop: 16 }}>{cliente.nome}</h1>
      <div className="cartao">
        <p style={{ margin: 0 }}>{[cliente.telefone, cliente.email].filter(Boolean).join(' · ')}</p>
        {cliente.nascimento && <p style={{ margin: 0 }}>Nascimento: {dataBr(cliente.nascimento + 'T12:00')}</p>}
        {cliente.cpf && <p style={{ margin: 0 }}>CPF: {cliente.cpf}</p>}
        {cliente.endereco && <p style={{ margin: 0 }}>Endereço: {cliente.endereco}</p>}
        {cliente.como_conheceu && <p style={{ margin: 0 }}>Como conheceu: {cliente.como_conheceu}</p>}
        {cliente.alergias && <p style={{ margin: '8px 0 0' }}><strong>Alergias e restrições:</strong> {cliente.alergias}</p>}
        {cliente.observacoes && <p style={{ margin: '8px 0 0' }}>{cliente.observacoes}</p>}
        {admin && <button className="leve" style={{ marginTop: 12 }} onClick={() => onEditar(cliente)}>Editar cadastro</button>}
      </div>
      <h2>Histórico</h2>
      <p className="vazio">
        {concluidos.length} atendimento(s) concluído(s)
        {concluidos[0] && ` · último em ${dataBr(concluidos[0].inicio)}`}
        {proximo && ` · próximo em ${dataBr(proximo.inicio)} às ${fmtHora(proximo.inicio)}`}
      </p>
      {itens.length === 0 && <p className="vazio">Nenhum atendimento registrado para esta cliente.</p>}
      {itens.map(i => (
        <div key={i.id} className={'cartao' + (['cancelado', 'faltou'].includes(i.status) ? ' apagado' : '')} style={{ borderLeft: `6px solid ${i.unidades?.cor || '#C4677F'}` }}>
          <strong>{dataBr(i.inicio)} às {fmtHora(i.inicio)}</strong> · {i.servicos?.nome}<br />
          <small>{i.usuarios?.nome} · {i.unidades?.nome} · {ROTULO[i.status]}</small>
          <textarea rows="2" placeholder="Anotações do atendimento" defaultValue={i.observacoes || ''}
            onBlur={e => db.from('agendamentos').update({ observacoes: e.target.value }).eq('id', i.id)} />
        </div>
      ))}
    </>
  )
}

function Clientes({ admin }) {
  const [lista, setLista] = useState([])
  const [busca, setBusca] = useState('')
  const [f, setF] = useState(null)
  const [sel, setSel] = useState(null)
  const carregar = async () => { const { data } = await db.from('clientes').select('*').order('nome'); setLista(data || []) }
  useEffect(() => { carregar() }, [])
  const salvar = async () => {
    if (!f.nome.trim()) return
    const { id, criado_em, ...dados } = f
    dados.nascimento = dados.nascimento || null
    if (id) await db.from('clientes').update(dados).eq('id', id)
    else await db.from('clientes').insert(dados)
    if (id && sel) setSel({ ...sel, ...dados })
    setF(null); carregar()
  }
  const campo = k => e => setF({ ...f, [k]: e.target.value })

  if (f) return (
    <>
      <h1>{f.id ? 'Editar cliente' : 'Novo cliente'}</h1>
      <div className="cartao form">
        <input placeholder="Nome completo" value={f.nome || ''} onChange={campo('nome')} />
        <input placeholder="Telefone / WhatsApp" value={f.telefone || ''} onChange={campo('telefone')} />
        <input placeholder="E-mail" value={f.email || ''} onChange={campo('email')} />
        <label>Nascimento <input type="date" value={f.nascimento || ''} onChange={campo('nascimento')} /></label>
        <input placeholder="CPF" value={f.cpf || ''} onChange={campo('cpf')} />
        <input placeholder="Endereço" value={f.endereco || ''} onChange={campo('endereco')} />
        <input placeholder="Como conheceu a clínica" value={f.como_conheceu || ''} onChange={campo('como_conheceu')} />
        <textarea rows="2" placeholder="Alergias e restrições" value={f.alergias || ''} onChange={campo('alergias')} />
        <textarea rows="3" placeholder="Observações gerais" value={f.observacoes || ''} onChange={campo('observacoes')} />
        <button onClick={salvar}>Salvar cliente</button>
        <button className="leve" onClick={() => setF(null)}>Cancelar</button>
      </div>
    </>
  )
  if (sel) return <Historico cliente={sel} admin={admin} onVoltar={() => setSel(null)} onEditar={c => setF({ ...vazioCliente, ...c })} />

  const vistos = lista.filter(c => c.nome.toLowerCase().includes(busca.toLowerCase()))
  return (
    <>
      <h1>Clientes</h1>
      <div className="form" style={{ marginBottom: 12 }}>
        <input placeholder="Buscar cliente pelo nome" value={busca} onChange={e => setBusca(e.target.value)} style={{ flex: 1 }} />
        {admin && <button onClick={() => setF({ ...vazioCliente })}>Novo cliente</button>}
      </div>
      {vistos.length === 0 && <p className="vazio">Nenhum cliente encontrado.</p>}
      {vistos.map(c => (
        <div key={c.id} className="cartao clicavel" onClick={() => setSel(c)}>
          <strong>{c.nome}</strong><br /><small>{c.telefone} {c.email}</small>
        </div>
      ))}
    </>
  )
}

function Painel({ irParaAgenda }) {
  const [retornos, setRetornos] = useState([])
  const [hoje, setHoje] = useState([])
  useEffect(() => {
    const fimSemana = somaDias(inicioSemana(new Date()), 6)
    db.from('v_retornos').select('*').lte('retorno_em', isoData(fimSemana)).order('retorno_em').then(({ data }) => setRetornos(data || []))
    const h0 = new Date(); h0.setHours(0, 0, 0, 0)
    db.from('agendamentos').select('*, clientes(nome), servicos(nome), usuarios(nome), unidades(nome,cor)')
      .gte('inicio', h0.toISOString()).lt('inicio', somaDias(h0, 1).toISOString()).neq('status', 'cancelado').order('inicio')
      .then(({ data }) => setHoje(data || []))
  }, [])
  const hojeIso = isoData(new Date())
  const zap = t => 'https://wa.me/55' + String(t || '').replace(/\D/g, '')
  return (
    <>
      <h1>Painel</h1>
      <div className="cartao">
        <h2>Clientes para chamar esta semana</h2>
        {retornos.length === 0 && <p className="vazio">Ninguém para chamar nesta semana.</p>}
        {retornos.map(r => (
          <div key={r.cliente_id + r.servico_id} className="linha retorno">
            <div>
              <strong>{r.cliente}</strong> · {r.servico}<br />
              <small>{r.retorno_em < hojeIso ? 'Atrasado desde ' : 'Retorno em '}{dataBr(r.retorno_em + 'T12:00')} (último atendimento em {dataBr(r.ultimo_atendimento + 'T12:00')})</small>
            </div>
            <div className="form">
              {r.telefone && <a className="botao" href={zap(r.telefone)} target="_blank" rel="noreferrer">Chamar no WhatsApp</a>}
              <button onClick={() => irParaAgenda({ cliente_id: r.cliente_id, servico_id: r.servico_id })}>Agendar</button>
            </div>
          </div>
        ))}
      </div>
      <div className="cartao">
        <h2>Atendimentos de hoje</h2>
        {hoje.length === 0 && <p className="vazio">Nenhum atendimento marcado para hoje.</p>}
        {hoje.map(i => (
          <div key={i.id} className="retorno" style={{ borderLeft: `5px solid ${i.unidades?.cor || '#C4677F'}`, paddingLeft: 10 }}>
            <strong>{fmtHora(i.inicio)}</strong> {i.clientes?.nome} · {i.servicos?.nome}<br /><small>{i.usuarios?.nome} · {ROTULO[i.status]}</small>
          </div>
        ))}
      </div>
    </>
  )
}

function Agenda({ usuario, prefill, limparPrefill, irParaReceber }) {
  const [semana, setSemana] = useState(inicioSemana(new Date()))
  const [itens, setItens] = useState([])
  const [ref, setRef] = useState({ unidades: [], clientes: [], servicos: [], profs: [] })
  const [fUnidade, setFUnidade] = useState('')
  const [fProf, setFProf] = useState('')
  const [novo, setNovo] = useState(null)
  const [aviso, setAviso] = useState('')
  useEffect(() => {
    if (!prefill) return
    setNovo({ cliente_id: prefill.cliente_id, servico_id: prefill.servico_id, unidade_id: '', profissional_id: usuario.id, data: isoData(new Date()), hora: '09:00' })
    limparPrefill()
  }, [prefill])
  const [erro, setErro] = useState('')

  useEffect(() => {
    Promise.all([
      db.from('unidades').select('*').eq('ativa', true).order('nome'),
      db.from('clientes').select('id,nome').order('nome'),
      db.from('servicos').select('*').eq('ativo', true).order('nome'),
      db.from('usuarios').select('id,nome').eq('ativo', true).order('nome'),
    ]).then(([u, c, s, p]) => setRef({ unidades: u.data || [], clientes: c.data || [], servicos: s.data || [], profs: p.data || [] }))
  }, [])

  const carregar = async () => {
    const { data } = await db.from('agendamentos')
      .select('*, clientes(nome), servicos(nome), usuarios(nome), unidades(nome,cor)')
      .gte('inicio', semana.toISOString()).lt('inicio', somaDias(semana, 7).toISOString()).order('inicio')
    setItens(data || [])
  }
  useEffect(() => { carregar() }, [semana])

  const abrirNovo = () => setNovo({ cliente_id: '', servico_id: '', unidade_id: '', profissional_id: usuario.id, data: isoData(new Date()), hora: '09:00' })
  const salvar = async () => {
    const s = ref.servicos.find(x => x.id === novo.servico_id)
    if (!novo.cliente_id || !s || !novo.unidade_id || !novo.profissional_id || !novo.data || !novo.hora) return setErro('Preencha todos os campos.')
    const ini = new Date(`${novo.data}T${novo.hora}`)
    const fim = new Date(ini.getTime() + s.duracao_min * 60000)
    const h = ref.unidades.find(u => u.id === novo.unidade_id)?.horario_funcionamento
    if (h?.abre && h?.fecha && (fmtHora(ini) < h.abre || fmtHora(fim) > h.fecha)) return setErro(`Fora do horário de funcionamento da unidade (${h.abre} às ${h.fecha}).`)
    const { error } = await db.from('agendamentos').insert({
      cliente_id: novo.cliente_id, servico_id: novo.servico_id, unidade_id: novo.unidade_id,
      profissional_id: novo.profissional_id, inicio: ini.toISOString(), fim: fim.toISOString(),
    })
    if (error) return setErro(error.code === '23P01' ? 'Esse horário já está ocupado para esta profissional.' : 'Não foi possível salvar. Tente de novo.')
    setNovo(null); setErro(''); setAviso(''); carregar()
  }
  const mudarStatus = async (a, status) => {
    await db.from('agendamentos').update({ status }).eq('id', a.id)
    carregar()
    if (status === 'concluido') {
      const s = ref.servicos.find(x => x.id === a.servico_id)
      setNovo({ cliente_id: a.cliente_id, servico_id: a.servico_id, unidade_id: a.unidade_id, profissional_id: a.profissional_id, data: isoData(somaDias(new Date(), s?.retorno_dias || 0)), hora: fmtHora(a.inicio) })
      setAviso(`Atendimento concluído. Agende o próximo de ${a.clientes?.nome}.`)
      window.scrollTo({ top: 0, behavior: 'smooth' })
    }
  }

  const dias = [0, 1, 2, 3, 4, 5, 6].map(n => somaDias(semana, n))
  const visiveis = itens.filter(i => (!fUnidade || i.unidade_id === fUnidade) && (!fProf || i.profissional_id === fProf))
  const campo = k => v => setNovo({ ...novo, [k]: v })
  const tituloSemana = `${dias[0].toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' })} a ${dias[6].toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' })}`

  return (
    <>
      <h1>Agenda</h1>
      <div className="cartao form">
        <button className="leve" onClick={() => setSemana(somaDias(semana, -7))}>Semana anterior</button>
        <strong>{tituloSemana}</strong>
        <button className="leve" onClick={() => setSemana(somaDias(semana, 7))}>Próxima semana</button>
        <Sel valor={fUnidade} onChange={setFUnidade} vazio="Todas as unidades" opcoes={ref.unidades.map(u => [u.id, u.nome])} />
        {usuario.perfil === 'admin' && <Sel valor={fProf} onChange={setFProf} vazio="Todas as profissionais" opcoes={ref.profs.map(p => [p.id, p.nome])} />}
        <button onClick={abrirNovo}>Novo atendimento</button>
      </div>

      {novo && (
        <div className="cartao form">
          {aviso && <p style={{ width: '100%', margin: 0 }}><strong>{aviso}</strong></p>}
          <Sel valor={novo.cliente_id} onChange={campo('cliente_id')} vazio="Cliente" opcoes={ref.clientes.map(c => [c.id, c.nome])} />
          <Sel valor={novo.servico_id} onChange={campo('servico_id')} vazio="Serviço" opcoes={ref.servicos.map(s => [s.id, `${s.nome} (${s.duracao_min} min)`])} />
          <Sel valor={novo.unidade_id} onChange={campo('unidade_id')} vazio="Unidade" opcoes={ref.unidades.map(u => [u.id, u.nome])} />
          {usuario.perfil === 'admin' && <Sel valor={novo.profissional_id} onChange={campo('profissional_id')} vazio="Profissional" opcoes={ref.profs.map(p => [p.id, p.nome])} />}
          <input type="date" value={novo.data} onChange={e => campo('data')(e.target.value)} />
          <input type="time" value={novo.hora} onChange={e => campo('hora')(e.target.value)} />
          <button onClick={salvar}>Salvar atendimento</button>
          <button className="leve" onClick={() => { setNovo(null); setErro(''); setAviso('') }}>Cancelar</button>
          {erro && <p className="erro" style={{ width: '100%' }}>{erro}</p>}
        </div>
      )}

      <div className="semana">
        {dias.map(d => (
          <div key={d.toISOString()} className="dia">
            <h3>{d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit' })}</h3>
            {visiveis.filter(i => new Date(i.inicio).toDateString() === d.toDateString()).map(i => (
              <div key={i.id} className={'atend' + (['cancelado', 'faltou'].includes(i.status) ? ' apagado' : '')} style={{ borderLeft: `5px solid ${i.unidades?.cor || '#C4677F'}` }}>
                <strong>{fmtHora(i.inicio)}</strong> {i.clientes?.nome}<br />
                <small>{i.servicos?.nome} · {i.usuarios?.nome}</small>
                <select value={i.status} onChange={e => mudarStatus(i, e.target.value)}>
                  {Object.entries(ROTULO).map(([k, r]) => <option key={k} value={k}>{r}</option>)}
                </select>
                {i.status === 'concluido' && usuario.perfil === 'admin' && (
                  <button className="leve" style={{ marginTop: 6, width: '100%', padding: 4 }}
                    onClick={() => irParaReceber({ agendamento_id: i.id, cliente_id: i.cliente_id, unidade_id: i.unidade_id, descricao: i.servicos?.nome || '', valor: ref.servicos.find(x => x.id === i.servico_id)?.preco || '' })}>Registrar pagamento</button>
                )}
              </div>
            ))}
          </div>
        ))}
      </div>
      {visiveis.length === 0 && <p className="vazio">Nenhum atendimento nesta semana. Use "Novo atendimento" para marcar o primeiro.</p>}
    </>
  )
}

const somaMeses = (iso, n) => {
  const [y, m, d] = iso.split('-').map(Number)
  return isoData(new Date(y, m - 1 + n, Math.min(d, new Date(y, m + n, 0).getDate())))
}

function Equipe({ eu }) {
  const [membros, setMembros] = useState([])
  const [unidades, setUnidades] = useState([])
  const [vinc, setVinc] = useState([])
  const [f, setF] = useState({ email: '', nome: '', perfil: 'profissional', unidades: [] })
  const [msg, setMsg] = useState('')
  const carregar = async () => {
    const [m, u, v] = await Promise.all([
      db.from('usuarios').select('*').order('nome'),
      db.from('unidades').select('id,nome,cor').eq('ativa', true).order('nome'),
      db.from('usuario_unidades').select('*'),
    ])
    setMembros(m.data || []); setUnidades(u.data || []); setVinc(v.data || [])
  }
  useEffect(() => { carregar() }, [])
  const adicionar = async () => {
    if (!f.email.trim() || !f.nome.trim()) return setMsg('Informe o e-mail do login e o nome.')
    const { error } = await db.rpc('adicionar_membro', { p_email: f.email.trim(), p_nome: f.nome.trim(), p_perfil: f.perfil, p_unidades: f.unidades })
    if (error) return setMsg(error.message)
    setMsg(''); setF({ email: '', nome: '', perfil: 'profissional', unidades: [] }); carregar()
  }
  const marcarForm = id => setF({ ...f, unidades: f.unidades.includes(id) ? f.unidades.filter(x => x !== id) : [...f.unidades, id] })
  const alternarUnidade = async (m, uid, marcado) => {
    if (marcado) await db.from('usuario_unidades').delete().match({ usuario_id: m.id, unidade_id: uid })
    else await db.from('usuario_unidades').insert({ usuario_id: m.id, unidade_id: uid })
    carregar()
  }
  const atualizar = async (m, campos) => { await db.from('usuarios').update(campos).eq('id', m.id); carregar() }
  return (
    <>
      <h1>Equipe</h1>
      <div className="cartao form">
        <p style={{ width: '100%', margin: 0 }} className="vazio">Primeiro crie o login da pessoa no Supabase (Authentication &gt; Users). Depois informe aqui o mesmo e-mail.</p>
        <input placeholder="E-mail do login" value={f.email} onChange={e => setF({ ...f, email: e.target.value })} />
        <input placeholder="Nome" value={f.nome} onChange={e => setF({ ...f, nome: e.target.value })} />
        <Sel valor={f.perfil} onChange={v => setF({ ...f, perfil: v })} vazio="Perfil" opcoes={[['admin', 'Administração'], ['profissional', 'Profissional']]} />
        {unidades.map(u => <label key={u.id}><input type="checkbox" checked={f.unidades.includes(u.id)} onChange={() => marcarForm(u.id)} /> {u.nome}</label>)}
        <button onClick={adicionar}>Adicionar à equipe</button>
        {msg && <p className="erro" style={{ width: '100%' }}>{msg}</p>}
      </div>
      {membros.map(m => (
        <div key={m.id} className="cartao" style={{ opacity: m.ativo ? 1 : .55 }}>
          <div className="linha">
            <strong>{m.nome}{m.id === eu && ' (você)'}</strong>
            <div className="form">
              <Sel valor={m.perfil} onChange={v => atualizar(m, { perfil: v })} vazio="Perfil" opcoes={[['admin', 'Administração'], ['profissional', 'Profissional']]} />
              {m.id !== eu && <button className="leve" onClick={() => atualizar(m, { ativo: !m.ativo })}>{m.ativo ? 'Desativar' : 'Reativar'}</button>}
            </div>
          </div>
          <div className="form" style={{ marginTop: 8 }}>
            {unidades.map(u => {
              const marcado = vinc.some(v => v.usuario_id === m.id && v.unidade_id === u.id)
              return <label key={u.id}><input type="checkbox" checked={marcado} onChange={() => alternarUnidade(m, u.id, marcado)} /> {u.nome}</label>
            })}
          </div>
        </div>
      ))}
    </>
  )
}

function Formas() {
  const [lista, setLista] = useState([])
  useEffect(() => { db.from('formas_pagamento').select('*').order('nome').then(({ data }) => setLista(data || [])) }, [])
  const salvar = (p, campo, v) => db.from('formas_pagamento').update({ [campo]: Number(v) || 0 }).eq('id', p.id)
  return (
    <>
      <h1 style={{ marginTop: 32 }}>Formas de pagamento</h1>
      {lista.map(p => (
        <div key={p.id} className="cartao linha">
          <strong>{p.nome}</strong>
          <small>Taxa <input type="number" step="0.01" style={{ width: 80, padding: 4 }} defaultValue={p.taxa_percentual} onBlur={e => salvar(p, 'taxa_percentual', e.target.value)} /> %
            · Cai em <input type="number" style={{ width: 70, padding: 4 }} defaultValue={p.dias_para_receber} onBlur={e => salvar(p, 'dias_para_receber', e.target.value)} /> dias</small>
        </div>
      ))}

}

function Financeiro({ prefill, limparPrefill }) {
  const hoje = new Date(), hojeIso = isoData(hoje)
  const [aba, setAba] = useState('resumo')
  const [mes, setMes] = useState(new Date(hoje.getFullYear(), hoje.getMonth(), 1))
  const [fUnidade, setFUnidade] = useState('')
  const [ref, setRef] = useState({ unidades: [], clientes: [], formas: [] })
  const [rec, setRec] = useState([])
  const [pag, setPag] = useState([])
  const [form, setForm] = useState(null)
  const [erro, setErro] = useState('')
  const ini = isoData(mes), fim = isoData(new Date(mes.getFullYear(), mes.getMonth() + 1, 0))

  const carregar = async () => {
    const filtro = `and(status.eq.pendente,vencimento.lte.${fim}),and(pago_em.gte.${ini},pago_em.lte.${fim})`
    const [r, p] = await Promise.all([
      db.from('parcelas_receber').select('*, contas_receber(descricao, unidade_id, clientes(nome), formas_pagamento(nome, taxa_percentual), unidades(cor))').or(filtro).order('vencimento'),
      db.from('contas_pagar').select('*, unidades(cor)').or(filtro).order('vencimento'),
    ])
    setRec(r.data || []); setPag(p.data || [])
  }
  useEffect(() => { carregar() }, [mes])
  useEffect(() => {
    Promise.all([
      db.from('unidades').select('id,nome').eq('ativa', true).order('nome'),
      db.from('clientes').select('id,nome').order('nome'),
      db.from('formas_pagamento').select('*').eq('ativa', true).order('nome'),
    ]).then(([u, c, f]) => setRef({ unidades: u.data || [], clientes: c.data || [], formas: f.data || [] }))
  }, [])
  const novoRec = (p = {}) => setForm({ tipo: 'receber', unidade_id: '', cliente_id: '', agendamento_id: '', forma_id: '', descricao: '', valor: '', parcelas: 1, data: hojeIso, recebido: true, ...p })
  const novoPag = () => setForm({ tipo: 'pagar', unidade_id: '', descricao: '', valor: '', data: hojeIso, meses: 1 })
  useEffect(() => { if (prefill) { setAba('receber'); novoRec(prefill); limparPrefill() } }, [prefill])

  const salvar = async () => {
    const total = Number(form.valor)
    if (!form.unidade_id || !form.descricao.trim() || !(total > 0)) return setErro('Preencha unidade, descrição e valor.')
    const falhou = () => setErro('Não foi possível salvar. Tente de novo.')
    if (form.tipo === 'pagar') {
      const n = Math.max(1, Number(form.meses) || 1)
      const linhas = Array.from({ length: n }, (_, k) => ({
        unidade_id: form.unidade_id, valor: total, vencimento: somaMeses(form.data, k), recorrente: n > 1,
        descricao: n > 1 ? `${form.descricao} (${k + 1}/${n})` : form.descricao,
      }))
      if ((await db.from('contas_pagar').insert(linhas)).error) return falhou()
    } else {
      const n = Math.max(1, Number(form.parcelas) || 1)
      const { data: conta, error } = await db.from('contas_receber').insert({
        unidade_id: form.unidade_id, cliente_id: form.cliente_id || null, agendamento_id: form.agendamento_id || null,
        forma_pagamento_id: form.forma_id || null, descricao: form.descricao, valor_total: total,
      }).select().single()
      if (error) return falhou()
      const base = Math.floor(total / n * 100) / 100
      const linhas = Array.from({ length: n }, (_, k) => ({
        conta_id: conta.id, numero: k + 1, vencimento: somaMeses(form.data, k),
        valor: k < n - 1 ? base : Number((total - base * (n - 1)).toFixed(2)),
        ...(form.recebido && k === 0 ? { status: 'paga', pago_em: hojeIso } : {}),
      }))
      if ((await db.from('parcelas_receber').insert(linhas)).error) return falhou()
    }
    setForm(null); setErro(''); carregar()
  }
  const baixar = async (tabela, i) => { await db.from(tabela).update({ status: 'paga', pago_em: hojeIso }).eq('id', i.id); carregar() }

  const R = rec.filter(i => !fUnidade || i.contas_receber?.unidade_id === fUnidade)
  const P = pag.filter(i => !fUnidade || i.unidade_id === fUnidade)
  const soma = l => l.reduce((t, i) => t + Number(i.valor), 0)
  const recebido = soma(R.filter(i => i.status === 'paga')), pago = soma(P.filter(i => i.status === 'paga'))
  const aReceber = soma(R.filter(i => i.status === 'pendente' && i.vencimento >= ini))
  const aPagar = soma(P.filter(i => i.status === 'pendente' && i.vencimento >= ini))
  const atrasR = soma(R.filter(i => i.status === 'pendente' && i.vencimento < ini))
  const atrasP = soma(P.filter(i => i.status === 'pendente' && i.vencimento < ini))
  const campo = k => v => setForm({ ...form, [k]: v })
  const situacao = i => i.status === 'paga' ? `Paga em ${dataBr(i.pago_em + 'T12:00')}` : i.vencimento < hojeIso ? 'Atrasada' : 'Pendente'

  return (
    <>
      <h1>Financeiro</h1>
      <div className="cartao form">
        {[['resumo', 'Resumo'], ['receber', 'A receber'], ['pagar', 'A pagar']].map(([k, r]) => <button key={k} className={aba === k ? '' : 'leve'} onClick={() => setAba(k)}>{r}</button>)}
        <button className="leve" onClick={() => setMes(new Date(mes.getFullYear(), mes.getMonth() - 1, 1))}>Mês anterior</button>
        <strong style={{ textTransform: 'capitalize' }}>{mes.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}</strong>
        <button className="leve" onClick={() => setMes(new Date(mes.getFullYear(), mes.getMonth() + 1, 1))}>Próximo mês</button>
        <Sel valor={fUnidade} onChange={setFUnidade} vazio="Todas as unidades" opcoes={ref.unidades.map(u => [u.id, u.nome])} />
      </div>

      {aba === 'resumo' && (
        <>
          <div className="resumo">
            {[['Recebido no mês', recebido], ['A receber no mês', aReceber], ['Pago no mês', pago], ['A pagar no mês', aPagar],
              ['Saldo realizado', recebido - pago], ['Saldo previsto', recebido - pago + aReceber - aPagar]].map(([t, v]) => (
              <div key={t} className="cartao"><small>{t}</small><div className="numero">{brl(v)}</div></div>
            ))}
          </div>
          {(atrasR > 0 || atrasP > 0) && <p className="erro">Em atraso de meses anteriores: {brl(atrasR)} a receber e {brl(atrasP)} a pagar.</p>}
        </>
      )}

      {aba !== 'resumo' && <div style={{ marginBottom: 12 }}><button onClick={aba === 'receber' ? () => novoRec() : novoPag}>{aba === 'receber' ? 'Novo recebimento' : 'Nova despesa'}</button></div>}

      {form && (
        <div className="cartao form">
          <Sel valor={form.unidade_id} onChange={campo('unidade_id')} vazio="Unidade" opcoes={ref.unidades.map(u => [u.id, u.nome])} />
          <input placeholder="Descrição" value={form.descricao} onChange={e => campo('descricao')(e.target.value)} />
          <input type="number" step="0.01" placeholder="Valor total (R$)" value={form.valor} onChange={e => campo('valor')(e.target.value)} />
          {form.tipo === 'receber' ? (
            <>
              <Sel valor={form.cliente_id} onChange={campo('cliente_id')} vazio="Cliente (opcional)" opcoes={ref.clientes.map(c => [c.id, c.nome])} />
              <Sel valor={form.forma_id} onChange={campo('forma_id')} vazio="Forma de pagamento" opcoes={ref.formas.map(p => [p.id, p.nome])} />
              <input type="number" min="1" placeholder="Parcelas" value={form.parcelas} onChange={e => campo('parcelas')(e.target.value)} style={{ width: 100 }} />
              <label>1º vencimento <input type="date" value={form.data} onChange={e => campo('data')(e.target.value)} /></label>
              <label><input type="checkbox" checked={form.recebido} onChange={e => campo('recebido')(e.target.checked)} /> Primeira parcela já recebida</label>
            </>
          ) : (
            <>
              <label>Vencimento <input type="date" value={form.data} onChange={e => campo('data')(e.target.value)} /></label>
              <input type="number" min="1" placeholder="Repetir por (meses)" value={form.meses} onChange={e => campo('meses')(e.target.value)} style={{ width: 160 }} />
            </>
          )}
          <button onClick={salvar}>Salvar</button>
          <button className="leve" onClick={() => { setForm(null); setErro('') }}>Cancelar</button>
          {erro && <p className="erro" style={{ width: '100%' }}>{erro}</p>}
        </div>
      )}

      {aba === 'receber' && (R.length === 0 ? <p className="vazio">Nada a receber ou recebido neste mês.</p> : R.map(i => {
        const c = i.contas_receber, taxa = Number(c?.formas_pagamento?.taxa_percentual || 0)
        return (
          <div key={i.id} className="cartao linha" style={{ borderLeft: `6px solid ${c?.unidades?.cor || '#C4677F'}` }}>
            <div>
              <strong>{dataBr(i.vencimento + 'T12:00')}</strong> · {c?.clientes?.nome || 'Sem cliente'} · {c?.descricao} (parcela {i.numero})<br />
              <small>{brl(i.valor)}{taxa > 0 && ` (líquido ${brl(i.valor * (1 - taxa / 100))})`} · {c?.formas_pagamento?.nome || 'Forma não informada'} · {situacao(i)}</small>
            </div>
            {i.status === 'pendente' && <button onClick={() => baixar('parcelas_receber', i)}>Marcar como recebida</button>}
          </div>
        )
      }))}

      {aba === 'pagar' && (P.length === 0 ? <p className="vazio">Nenhuma despesa a pagar ou paga neste mês.</p> : P.map(i => (
        <div key={i.id} className="cartao linha" style={{ borderLeft: `6px solid ${i.unidades?.cor || '#C4677F'}` }}>
          <div><strong>{dataBr(i.vencimento + 'T12:00')}</strong> · {i.descricao}<br /><small>{brl(i.valor)} · {situacao(i)}</small></div>
          {i.status === 'pendente' && <button onClick={() => baixar('contas_pagar', i)}>Marcar como paga</button>}
        </div>
      )))}
    </>
  )
}

function App() {
  const [sessao, setSessao] = useState(null)
  const [carregando, setCarregando] = useState(true)
  const [usuario, setUsuario] = useState(null)
  const [pagina, setPagina] = useState('painel')
  const [prefill, setPrefill] = useState(null)
  const [prefillRec, setPrefillRec] = useState(null)

  useEffect(() => {
    db.auth.getSession().then(({ data }) => { setSessao(data.session); setCarregando(false) })
    const { data } = db.auth.onAuthStateChange((_e, s) => setSessao(s))
    return () => data.subscription.unsubscribe()
  }, [])

  useEffect(() => {
    if (!sessao) return setUsuario(null)
    db.from('usuarios').select('*').eq('id', sessao.user.id).single().then(({ data }) => setUsuario(data))
  }, [sessao])

  if (carregando) return <p className="vazio" style={{ padding: 24 }}>Carregando...</p>
  if (!sessao) return <Login />
  if (!usuario) return <p className="vazio" style={{ padding: 24 }}>Sua conta ainda não tem perfil. Peça à administração para liberar o acesso.</p>

  const admin = usuario.perfil === 'admin'
  const itens = MENU.filter(([, , soAdmin]) => admin || !soAdmin)
  return (
    <div className="app">
      <nav className="menu">
        <h2>Clínica</h2>
        {itens.map(([k, rotulo]) => (
          <button key={k} className={pagina === k ? 'ativo' : ''} onClick={() => setPagina(k)}>{rotulo}</button>
        ))}
        <button className="sair" onClick={() => db.auth.signOut()}>Sair</button>
      </nav>
      <main>
        {pagina === 'painel' ? <Painel irParaAgenda={p => { setPrefill(p); setPagina('agenda') }} /> :
         pagina === 'agenda' ? <Agenda usuario={usuario} prefill={prefill} limparPrefill={() => setPrefill(null)} irParaReceber={p => { setPrefillRec(p); setPagina('financeiro') }} /> :
         pagina === 'financeiro' ? <Financeiro prefill={prefillRec} limparPrefill={() => setPrefillRec(null)} /> :
         pagina === 'clientes' ? <Clientes admin={admin} /> :
         pagina === 'admin' ? <><Equipe eu={usuario.id} /><Unidades /><Servicos /><Formas /></> : (
          <>
            <h1>{itens.find(([k]) => k === pagina)?.[1]}</h1>
            <p className="vazio">Esta tela será o próximo módulo a construir.</p>
          </>
        )}
      </main>
    </div>
  )
}

function Raiz() {
  if (!configurado) return (
    <div className="login">
      <h1>Falta conectar o Supabase</h1>
      <p>Abra o <code>index.html</code>, procure o bloco CONFIGURAÇÃO no início do script e cole a URL e a chave anon do seu projeto.</p>
    </div>
  )
  return <App />
}

ReactDOM.createRoot(document.getElementById('root')).render(<Raiz />)
</script>
</body>
</html>
