<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Greice Dietrich Stúdio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root { --nude:#FBF3F0; --areia:#F1DDD6; --blush:#F8DCE3; --rosa:#D4708A; --rosa-esc:#B5516D; --vinho:#4A2A36; --suave:#93707C; --sombra:0 6px 24px rgba(181,81,109,.10) }
* { box-sizing:border-box }
body { margin:0; color:var(--vinho); font:400 15.5px/1.55 'Jost', system-ui, sans-serif;
  background:radial-gradient(1100px 520px at 88% -12%, #FCE1E7 0, transparent 62%), var(--nude) }
h1, h2, h3 { font-family:'Cormorant Garamond', Georgia, serif; font-weight:600; letter-spacing:.2px; margin:0 0 14px }
h1 { font-size:2.4rem; line-height:1.1 } h2 { font-size:1.6rem }
.app { padding-left:76px; min-height:100vh }

/* menu lateral: só ícones, abre ao passar o mouse */
.menu { position:fixed; inset:0 auto 0 0; width:76px; z-index:20; padding:18px 12px; display:flex; flex-direction:column; gap:6px; overflow:hidden;
  background:linear-gradient(180deg, #E6A6B8, #C0587A); transition:width .28s ease, box-shadow .28s }
.menu:hover, .menu:focus-within { width:250px; box-shadow:10px 0 40px rgba(181,81,109,.28) }
.menu button { display:flex; align-items:center; gap:16px; width:100%; background:none; color:#fff; border:0; box-shadow:none;
  padding:12px 14px; border-radius:16px; cursor:pointer; font:500 15px 'Jost', sans-serif; white-space:nowrap; transform:none; transition:background .2s }
.menu button:hover { background:rgba(255,255,255,.2); box-shadow:none; transform:none }
.menu button.ativo, .menu button.ativo:hover { background:#fff; color:var(--rosa-esc); box-shadow:0 4px 14px rgba(0,0,0,.08) }
.menu svg { flex:none }
.menu span { opacity:0; transition:opacity .2s }
.menu:hover span, .menu:focus-within span { opacity:1 }
.marca { display:flex; align-items:center; gap:16px; color:#fff; padding:6px 14px 20px; font:600 1.6rem 'Cormorant Garamond', serif; white-space:nowrap }
.menu .sair { margin-top:auto }

main { padding:26px 38px 52px; max-width:1300px; animation:entra .3s ease }
@keyframes entra { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
.topo { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; color:var(--suave) }
.topo strong { font:600 1.4rem 'Cormorant Garamond', serif; color:var(--vinho) }
.topo small { text-transform:capitalize }
.avatar { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:600; background:linear-gradient(135deg, #F3B7C4, #D4708A) }

input, select, textarea { font:inherit; padding:11px 14px; border:1.5px solid var(--areia); border-radius:12px; background:#fff; color:var(--vinho); transition:border-color .2s, box-shadow .2s }
input:focus, select:focus, textarea:focus { outline:0; border-color:var(--rosa); box-shadow:0 0 0 4px rgba(212,112,138,.16) }
textarea { width:100% }
button { font:500 15px 'Jost', sans-serif; color:#fff; border:0; padding:11px 22px; border-radius:999px; cursor:pointer;
  background:linear-gradient(135deg, #E08AA0, #C45F7E); box-shadow:0 4px 14px rgba(196,95,126,.28); transition:transform .15s, box-shadow .2s, background .2s }
button:hover { transform:translateY(-1px); box-shadow:0 8px 20px rgba(196,95,126,.32) }
button:active { transform:none }
button.leve { background:var(--blush); color:var(--rosa-esc); box-shadow:none }
button.leve:hover { background:#F3C5D0; box-shadow:none }
:focus-visible { outline:3px solid var(--rosa-esc); outline-offset:2px }
label { display:inline-flex; gap:6px; align-items:center }

.cartao { background:#fff; border:1px solid #F3E4DF; border-radius:20px; padding:18px 20px; margin-bottom:14px; box-shadow:var(--sombra) }
.cartao.apagado { opacity:.55 }
.form { display:flex; flex-wrap:wrap; gap:10px; align-items:center }
.linha { display:flex; justify-content:space-between; align-items:center; gap:12px }
.vazio { color:var(--suave) } .erro { color:#b3261e; margin:0 }
.clicavel { cursor:pointer; transition:transform .2s, box-shadow .2s }
.clicavel:hover { transform:translateY(-3px); box-shadow:0 12px 30px rgba(181,81,109,.18) }
.login { max-width:380px; margin:12vh auto; background:#fff; padding:36px 30px; border-radius:28px; box-shadow:var(--sombra); display:flex; flex-direction:column; gap:14px; text-align:center }
.login svg { align-self:center; color:var(--rosa) }
.resumo { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:14px }
.resumo .cartao { margin:0; transition:transform .2s } .resumo .cartao:hover { transform:translateY(-3px) }
.numero { font:600 2rem 'Cormorant Garamond', serif; color:var(--rosa-esc) }
.retorno { padding:12px 0; border-top:1px solid var(--areia); gap:12px; flex-wrap:wrap }
a.botao { background:var(--blush); color:var(--rosa-esc); text-decoration:none; padding:11px 20px; border-radius:999px; font-weight:500; transition:background .2s }
a.botao:hover { background:#F3C5D0 }

/* agenda: semana */
.semana { display:grid; grid-template-columns:repeat(auto-fit, minmax(165px, 1fr)); gap:12px }
.semana[hidden] { display:none }
.dia { background:#fff; border:1px solid #F3E4DF; border-radius:18px; padding:12px; min-height:130px; box-shadow:var(--sombra) }
.dia h3 { font-size:1.2rem; text-transform:capitalize; margin:0 0 10px }
.atend { background:var(--nude); border-radius:12px; padding:10px; margin-bottom:8px; font-size:.92rem; transition:transform .15s }
.atend:hover { transform:translateX(3px) }
.atend select { width:100%; margin-top:6px; padding:5px 8px; font-size:.85rem; border-radius:10px }
.atend.apagado { opacity:.5; text-decoration:line-through }

/* agenda: dia, uma coluna por profissional */
.chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px }
.chips button { padding:8px 16px; text-transform:capitalize }
.grade { display:grid; gap:0 8px; background:#fff; border-radius:20px; padding:14px; box-shadow:var(--sombra); overflow-x:auto }
.gcab { text-align:center; font:600 1.2rem 'Cormorant Garamond', serif; padding-bottom:10px }
.ghoras { position:relative; font-size:.78rem; color:var(--suave) }
.ghoras span { position:absolute; right:6px; transform:translateY(-50%) }
.gcol { position:relative; border-left:1px dashed var(--areia);
  background-image:repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--px) - 1px), #F6EAE6 calc(var(--px) - 1px), #F6EAE6 var(--px)) }
.gatend { position:absolute; left:4px; right:4px; border-radius:12px; border-left:4px solid; padding:5px 9px; font-size:.82rem; overflow:hidden; transition:box-shadow .2s }
.gatend:hover { z-index:5; height:auto !important; overflow:visible; background:#fff !important; box-shadow:0 10px 28px rgba(181,81,109,.28) }
.gatend select { display:none; width:100%; margin-top:4px; padding:3px 6px; font-size:.8rem; border-radius:8px }
.gatend:hover select { display:block }
.gatend.apagado { opacity:.5 }

.barra { display:grid; grid-template-columns:150px 1fr 100px; gap:12px; align-items:center; margin:10px 0 }
.barra strong { text-align:right }
.trilho { background:var(--blush); border-radius:999px; height:12px; overflow:hidden }
.trilho div { height:100%; border-radius:999px; background:linear-gradient(90deg, #E6A6B8, #C45F7E); transition:width .5s ease }
.zaps { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px }
.zap { display:inline-flex; align-items:center; gap:5px; font-size:.78rem; padding:4px 11px; border-radius:999px; background:var(--blush); color:var(--rosa-esc); text-decoration:none; transition:background .2s }
.zap:hover { background:#F3C5D0 }
.gatend .zaps { display:none } .gatend:hover .zaps { display:flex }
.balao { background:#FFF0F3; border:1px solid var(--blush); border-radius:18px 18px 18px 4px; padding:14px 16px; white-space:pre-wrap; max-width:440px }
.chips-campo { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px }
.hub { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:18px }
.tile { display:flex; flex-direction:column; align-items:flex-start; gap:8px; text-align:left; padding:26px; border-radius:24px;
  background:#fff; color:var(--vinho); border:1px solid #F3E4DF; box-shadow:var(--sombra); transition:transform .25s, box-shadow .25s }
.tile:hover { transform:translateY(-5px); box-shadow:0 16px 36px rgba(181,81,109,.2) }
.tile-icone { width:54px; height:54px; border-radius:18px; display:grid; place-items:center; background:var(--blush); color:var(--rosa-esc); transition:background .25s, color .25s, transform .25s }
.tile:hover .tile-icone { background:linear-gradient(135deg, #E08AA0, #C45F7E); color:#fff; transform:rotate(-6deg) scale(1.06) }
.tile-titulo { font:600 1.5rem 'Cormorant Garamond', serif; margin-top:6px }
.tile-desc { color:var(--suave); font:400 .93rem/1.4 'Jost', sans-serif }
.sec { animation:entra .3s ease }
.fundo { position:fixed; inset:0; z-index:50; display:grid; place-items:center; background:rgba(74,42,54,.45); backdrop-filter:blur(3px); animation:entra .2s ease }
.modal { background:#fff; border-radius:24px; padding:26px; width:calc(100% - 32px); max-width:460px; box-shadow:0 20px 60px rgba(74,42,54,.3) }
.modal h2 { margin-bottom:6px } .modal p { margin:0 0 12px }
button:disabled { opacity:.6; cursor:wait }
.excluir { background:none; box-shadow:none; color:var(--suave); padding:3px 10px; border-radius:10px; font-size:.82rem }
.excluir:hover { background:var(--blush); color:var(--rosa-esc); box-shadow:none; transform:none }
.gatend .excluir { display:none; float:right }
.gatend:hover .excluir { display:inline-block }
.logo-login { width:230px; max-width:100%; align-self:center; margin-bottom:6px }
.marca img { width:42px; height:auto; flex:none; filter:brightness(0) invert(1) }
.marca span { display:flex; flex-direction:column; line-height:1.15 }
.marca b { font:600 1.35rem 'Cormorant Garamond', serif; letter-spacing:.08em }
.marca small { font:500 .68rem 'Jost', sans-serif; letter-spacing:.42em; text-transform:uppercase }
.mono-topo { display:none; width:40px; height:auto; margin-right:12px }
.topo div:first-of-type { flex:1 }
@media (max-width:760px) {
  .mono-topo { display:block }
  .barra { grid-template-columns:100px 1fr 80px }
  .app { padding-left:0; padding-bottom:88px }
  .menu { inset:auto 0 0 0; width:100%; height:72px; flex-direction:row; justify-content:space-around; padding:8px; border-radius:24px 24px 0 0 }
  .menu:hover, .menu:focus-within { width:100% }
  .menu span, .marca { display:none }
  .menu button { justify-content:center; padding:10px; width:auto }
  .menu .sair { margin:0 }
  main { padding:20px 16px } h1 { font-size:2rem }
}
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important } }
</style>

function Login() {
  const [email, setEmail] = useState('')
  const [senha, setSenha] = useState('')
  const [erro, setErro] = useState('')
  const entrar = async () => {
    const { error } = await db.auth.signInWithPassword({ email, password: senha })
    if (error) setErro('E-mail ou senha incorretos. Confira e tente de novo.')
  }
  return (
    <div className="login">
      <img className="logo-login" src={LOGO} alt="Greice Dietrich Stúdio" />
      <h2 style={{ margin: 0 }}>Entrar</h2>
      <input placeholder="E-mail" value={email} onChange={e => setEmail(e.target.value)} />
      <input placeholder="Senha" type="password" value={senha} onChange={e => setSenha(e.target.value)} />
      {erro && <p className="erro">{erro}</p>}
      <button onClick={entrar}>Entrar</button>
    </div>
  )
}

const vazioUnidade = { nome: '', endereco: '', telefone: '', cor: '#C4677F' }

function Unidades() {
  const [lista, setLista] = useState([])
  const [form, setForm] = useState(vazioUnidade)
  const carregar = async () => {
    const { data } = await db.from('unidades').select('*').order('nome')
    setLista(data || [])
  }
  useEffect(() => { carregar() }, [])
  const salvar = async () => {
    if (!form.nome.trim()) return
    await db.from('unidades').insert(form)
    setForm(vazioUnidade); carregar()
  }
  const salvarHorario = async (u, k, v) => {
    await db.from('unidades').update({ horario_funcionamento: { ...u.horario_funcionamento, [k]: v } }).eq('id', u.id)
    carregar()
  }
  const alternar = async u => {
    await db.from('unidades').update({ ativa: !u.ativa }).eq('id', u.id)
    carregar()
  }
  const campo = k => e => setForm({ ...form, [k]: e.target.value })
  return (
    <>
      <h1>Unidades</h1>
      <div className="cartao form">
        <input placeholder="Nome da unidade" value={form.nome} onChange={campo('nome')} />
        <input placeholder="Endereço" value={form.endereco} onChange={campo('endereco')} />
        <input placeholder="Telefone / WhatsApp" value={form.telefone} onChange={campo('telefone')} />
        <label>Cor na agenda <input type="color" value={form.cor} onChange={campo('cor')} /></label>
        <button onClick={salvar}>Salvar unidade</button>
      </div>
      {lista.length === 0 && <p className="vazio">Nenhuma unidade cadastrada. Cadastre a primeira acima.</p>}
      {lista.map(u => (
        <div key={u.id} className="cartao linha" style={{ borderLeft: `6px solid ${u.cor}` }}>
          <div><strong>{u.nome}</strong><br /><small>{u.endereco} {u.telefone}</small><br />
            <small>Funciona das <input type="time" style={{ padding: 4 }} defaultValue={u.horario_funcionamento?.abre || ''} onBlur={e => salvarHorario(u, 'abre', e.target.value)} /> às{' '}
              <input type="time" style={{ padding: 4 }} defaultValue={u.horario_funcionamento?.fecha || ''} onBlur={e => salvarHorario(u, 'fecha', e.target.value)} /></small></div>
          <button className="leve" onClick={() => alternar(u)}>{u.ativa ? 'Desativar' : 'Reativar'}</button>
        </div>
      ))}
    </>
  )
}

const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
const fmtHora = d => new Date(d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
const somaDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x }
const inicioSemana = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return somaDias(x, -((x.getDay() + 6) % 7)) }
const isoData = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
const ROTULO = { agendado: 'Agendado', confirmado: 'Confirmado', concluido: 'Concluído', cancelado: 'Cancelado', faltou: 'Faltou' }

function Sel({ valor, onChange, opcoes, vazio }) {
  return (
    <select value={valor} onChange={e => onChange(e.target.value)}>
      <option value="">{vazio}</option>
      {opcoes.map(([id, rotulo]) => <option key={id} value={id}>{rotulo}</option>)}
    </select>
  )
}

function Servicos() {
  const [lista, setLista] = useState([])
  const [f, setF] = useState({ nome: '', preco: '', duracao_min: 60, retorno_dias: '' })
  const carregar = async () => { const { data } = await db.from('servicos').select('*').order('nome'); setLista(data || []) }
  useEffect(() => { carregar() }, [])
  const salvar = async () => {
    if (!f.nome.trim()) return
    await db.from('servicos').insert({ nome: f.nome, preco: Number(f.preco) || 0, duracao_min: Number(f.duracao_min) || 60, retorno_dias: Number(f.retorno_dias) || null })
    setF({ nome: '', preco: '', duracao_min: 60, retorno_dias: '' }); carregar()
  }
  const alternar = async s => { await db.from('servicos').update({ ativo: !s.ativo }).eq('id', s.id); carregar() }
  return (
    <>
      <h1>Serviços</h1>
      <div className="cartao form">
        <input placeholder="Nome (ex.: Design de sobrancelha)" value={f.nome} onChange={e => setF({ ...f, nome: e.target.value })} />
        <input type="number" placeholder="Preço (R$)" value={f.preco} onChange={e => setF({ ...f, preco: e.target.value })} />
        <input type="number" placeholder="Duração (min)" value={f.duracao_min} onChange={e => setF({ ...f, duracao_min: e.target.value })} />
        <input type="number" placeholder="Chamar de novo após (dias)" value={f.retorno_dias} onChange={e => setF({ ...f, retorno_dias: e.target.value })} />
        <button onClick={salvar}>Salvar serviço</button>
      </div>
      {lista.length === 0 && <p className="vazio">Nenhum serviço cadastrado. Cadastre o primeiro acima.</p>}
      {lista.map(s => (
        <div key={s.id} className="cartao linha">
          <div><strong>{s.nome}</strong><br /><small>{brl(s.preco)} · {s.duracao_min} min</small><br />
            <small>Chamar de novo após <input type="number" style={{ width: 70, padding: 4 }} defaultValue={s.retorno_dias || ''} placeholder="dias"
              onBlur={e => db.from('servicos').update({ retorno_dias: Number(e.target.value) || null }).eq('id', s.id)} /> dias</small></div>
          <button className="leve" onClick={() => alternar(s)}>{s.ativo ? 'Desativar' : 'Reativar'}</button>
        </div>
      ))}
    </>
  )
}

const vazioCliente = { nome: '', telefone: '', email: '', nascimento: '', cpf: '', endereco: '', como_conheceu: '', alergias: '', observacoes: '' }
const dataBr = d => new Date(d).toLocaleDateString('pt-BR')

function Historico({ cliente, admin, onVoltar, onEditar }) {
  const [itens, setItens] = useState([])
  useEffect(() => {
    db.from('agendamentos').select('*, servicos(nome), usuarios(nome), unidades(nome,cor)')
      .eq('cliente_id', cliente.id).order('inicio', { ascending: false }).then(({ data }) => setItens(data || []))
  }, [cliente.id])
  const concluidos = itens.filter(i => i.status === 'concluido')
  const proximo = [...itens].reverse().find(i => ['agendado', 'confirmado'].includes(i.status) && new Date(i.inicio) > new Date())
  return (
    <>
      <button className="leve" onClick={onVoltar}>Voltar para a lista</button>
      <h1 style={{ marginTop: 16 }}>{cliente.nome}</h1>
      <div className="cartao">
        <p style={{ margin: 0 }}>{[cliente.telefone, cliente.email].filter(Boolean).join(' · ')}</p>
        {cliente.nascimento && <p style={{ margin: 0 }}>Nascimento: {dataBr(cliente.nascimento + 'T12:00')}</p>}
        {cliente.cpf && <p style={{ margin: 0 }}>CPF: {cliente.cpf}</p>}
        {cliente.endereco && <p style={{ margin: 0 }}>Endereço: {cliente.endereco}</p>}
        {cliente.como_conheceu && <p style={{ margin: 0 }}>Como conheceu: {cliente.como_conheceu}</p>}
        {cliente.alergias && <p style={{ margin: '8px 0 0' }}><strong>Alergias e restrições:</strong> {cliente.alergias}</p>}
        {cliente.observacoes && <p style={{ margin: '8px 0 0' }}>{cliente.observacoes}</p>}
        {admin && <button className="leve" style={{ marginTop: 12 }} onClick={() => onEditar(cliente)}>Editar cadastro</button>}
      </div>
      <h2>Histórico</h2>
      <p className="vazio">
        {concluidos.length} atendimento(s) concluído(s)
        {concluidos[0] && ` · último em ${dataBr(concluidos[0].inicio)}`}
        {proximo && ` · próximo em ${dataBr(proximo.inicio)} às ${fmtHora(proximo.inicio)}`}
      </p>
      {itens.length === 0 && <p className="vazio">Nenhum atendimento registrado para esta cliente.</p>}
      {itens.map(i => (
        <div key={i.id} className={'cartao' + (['cancelado', 'faltou'].includes(i.status) ? ' apagado' : '')} style={{ borderLeft: `6px solid ${i.unidades?.cor || '#C4677F'}` }}>
          <strong>{dataBr(i.inicio)} às {fmtHora(i.inicio)}</strong> · {i.servicos?.nome}<br />
          <small>{i.usuarios?.nome} · {i.unidades?.nome} · {ROTULO[i.status]}</small>
          <textarea rows="2" placeholder="Anotações do atendimento" defaultValue={i.observacoes || ''}
            onBlur={e => db.from('agendamentos').update({ observacoes: e.target.value }).eq('id', i.id)} />
        </div>
      ))}
    </>
  )
}

function Clientes({ admin }) {
  const [lista, setLista] = useState([])
  const [busca, setBusca] = useState('')
  const [f, setF] = useState(null)
  const [sel, setSel] = useState(null)
  const carregar = async () => { const { data } = await db.from('clientes').select('*').order('nome'); setLista(data || []) }
  useEffect(() => { carregar() }, [])
  const salvar = async () => {
    if (!f.nome.trim()) return
    const { id, criado_em, ...dados } = f
    dados.nascimento = dados.nascimento || null
    if (id) await db.from('clientes').update(dados).eq('id', id)
    else await db.from('clientes').insert(dados)
    if (id && sel) setSel({ ...sel, ...dados })
    setF(null); carregar()
  }
  const campo = k => e => setF({ ...f, [k]: e.target.value })

  if (f) return (
    <>
      <h1>{f.id ? 'Editar cliente' : 'Novo cliente'}</h1>
      <div className="cartao form">
        <input placeholder="Nome completo" value={f.nome || ''} onChange={campo('nome')} />
        <input placeholder="Telefone / WhatsApp" value={f.telefone || ''} onChange={campo('telefone')} />
        <input placeholder="E-mail" value={f.email || ''} onChange={campo('email')} />
        <label>Nascimento <input type="date" value={f.nascimento || ''} onChange={campo('nascimento')} /></label>
        <input placeholder="CPF" value={f.cpf || ''} onChange={campo('cpf')} />
        <input placeholder="Endereço" value={f.endereco || ''} onChange={campo('endereco')} />
        <input placeholder="Como conheceu a clínica" value={f.como_conheceu || ''} onChange={campo('como_conheceu')} />
        <textarea rows="2" placeholder="Alergias e restrições" value={f.alergias || ''} onChange={campo('alergias')} />
        <textarea rows="3" placeholder="Observações gerais" value={f.observacoes || ''} onChange={campo('observacoes')} />
        <button onClick={salvar}>Salvar cliente</button>
        <button className="leve" onClick={() => setF(null)}>Cancelar</button>
      </div>
    </>
  )
  if (sel) return <Historico cliente={sel} admin={admin} onVoltar={() => setSel(null)} onEditar={c => setF({ ...vazioCliente, ...c })} />

  const vistos = lista.filter(c => c.nome.toLowerCase().includes(busca.toLowerCase()))
  return (
    <>
      <h1>Clientes</h1>
      <div className="form" style={{ marginBottom: 12 }}>
        <input placeholder="Buscar cliente pelo nome" value={busca} onChange={e => setBusca(e.target.value)} style={{ flex: 1 }} />
        {admin && <button onClick={() => setF({ ...vazioCliente })}>Novo cliente</button>}
      </div>
      {vistos.length === 0 && <p className="vazio">Nenhum cliente encontrado.</p>}
      {vistos.map(c => (
        <div key={c.id} className="cartao clicavel" onClick={() => setSel(c)}>
          <strong>{c.nome}</strong><br /><small>{c.telefone} {c.email}</small>
        </div>
      ))}
    </>
  )
}

function Painel({ irParaAgenda }) {
  const [retornos, setRetornos] = useState([])
  const [hoje, setHoje] = useState([])
  const modelos = useModelos()
  useEffect(() => {
    const fimSemana = somaDias(inicioSemana(new Date()), 6)
    db.from('v_retornos').select('*').lte('retorno_em', isoData(fimSemana)).order('retorno_em').then(({ data }) => setRetornos(data || []))
    const h0 = new Date(); h0.setHours(0, 0, 0, 0)
    db.from('agendamentos').select('*, clientes(nome, telefone), servicos(nome), usuarios(nome), unidades(nome, cor, endereco)')
      .gte('inicio', h0.toISOString()).lt('inicio', somaDias(h0, 1).toISOString()).neq('status', 'cancelado').order('inicio')
      .then(({ data }) => setHoje(data || []))
  }, [])
  const hojeIso = isoData(new Date())
  const zap = t => 'https://wa.me/55' + String(t || '').replace(/\D/g, '')
  return (
    <>
      <h1>Painel</h1>
      <div className="cartao">
        <h2>Clientes para chamar esta semana</h2>
        {retornos.length === 0 && <p className="vazio">Ninguém para chamar nesta semana.</p>}
        {retornos.map(r => (
          <div key={r.cliente_id + r.servico_id} className="linha retorno">
            <div>
              <strong>{r.cliente}</strong> · {r.servico}<br />
              <small>{r.retorno_em < hojeIso ? 'Atrasado desde ' : 'Retorno em '}{dataBr(r.retorno_em + 'T12:00')} (último atendimento em {dataBr(r.ultimo_atendimento + 'T12:00')})</small>
            </div>
            <div className="form">
              {r.telefone && <a className="botao" href={zap(r.telefone)} target="_blank" rel="noreferrer">Chamar no WhatsApp</a>}
              <button onClick={() => irParaAgenda({ cliente_id: r.cliente_id, servico_id: r.servico_id })}>Agendar</button>
            </div>
          </div>
        ))}
      </div>
      <div className="cartao">
        <h2>Atendimentos de hoje</h2>
        {hoje.length === 0 && <p className="vazio">Nenhum atendimento marcado para hoje.</p>}
        {hoje.map(i => (
          <div key={i.id} className="retorno" style={{ borderLeft: `5px solid ${i.unidades?.cor || '#C4677F'}`, paddingLeft: 10 }}>
            <strong>{fmtHora(i.inicio)}</strong> {i.clientes?.nome} · {i.servicos?.nome}<br /><small>{i.usuarios?.nome} · {ROTULO[i.status]}</small><br /><Zaps a={i} modelos={modelos} />
          </div>
        ))}
      </div>
    </>
  )
}

const excluirRegistro = async (tipo, id, justificativa) => {
  const { error } = await db.rpc('excluir_com_justificativa', { p_tipo: tipo, p_id: id, p_justificativa: justificativa })
  if (!error) return null
  if (error.code === '23503') return 'Este atendimento tem um pagamento registrado. Exclua primeiro o recebimento, na aba Financeiro.'
  return error.message || 'Não foi possível excluir. Tente de novo.'
}

function Justificativa({ titulo, onConfirmar, onCancelar }) {
  const [texto, setTexto] = useState('')
  const [erro, setErro] = useState('')
  const [enviando, setEnviando] = useState(false)
  const confirmar = async () => {
    if (texto.trim().length < 3) return setErro('A justificativa é obrigatória.')
    setEnviando(true)
    const msg = await onConfirmar(texto.trim())
    if (msg) { setErro(msg); setEnviando(false) }
  }
  return (
    <div className="fundo" onClick={onCancelar}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h2>Excluir</h2>
        <p>{titulo}</p>
        <textarea rows="3" autoFocus placeholder="Justificativa da exclusão (obrigatória)" value={texto} onChange={e => setTexto(e.target.value)} />
        {erro && <p className="erro" style={{ marginTop: 8 }}>{erro}</p>}
        <div className="form" style={{ marginTop: 12 }}>
          <button onClick={confirmar} disabled={enviando}>Excluir definitivamente</button>
          <button className="leve" onClick={onCancelar}>Cancelar</button>
        </div>
      </div>
    </div>
  )
}

const PONTOS_POR_REAL = 1 // pontos de fidelidade ganhos a cada R$ 1 pago
const FALHA = 'Não foi possível salvar. Tente de novo.'

const MODELOS_PADRAO = {
  confirmacao: 'Olá, [cliente]!\nSeu horário [dia e hora] foi confirmado!',
  lembrete: 'Olá, [cliente]!\nNão esqueça do seu horário [dia e hora].\n\nNo endereço: [endereço]\n\nCom a profissional: [profissional]',
}
const TIPOS_MSG = [['confirmacao', 'Confirmação de horário'], ['lembrete', 'Lembrete de horário']]
const CAMPOS_MSG = ['[cliente]', '[dia e hora]', '[endereço]', '[profissional]', '[serviço]']

function useModelos() {
  const [m, setM] = useState(MODELOS_PADRAO)
  useEffect(() => {
    db.from('mensagens_modelo').select('tipo,texto').then(({ data }) => {
      if (data?.length) setM(x => ({ ...x, ...Object.fromEntries(data.map(d => [d.tipo, d.texto])) }))
    })
  }, [])
  return m
}
const montarMensagem = (modelo, a) => {
  const quando = `${new Date(a.inicio).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' })} às ${fmtHora(a.inicio)}`
  return modelo
    .replaceAll('[cliente]', a.clientes?.nome || '')
    .replaceAll('[dia e hora]', quando)
    .replaceAll('[endereço]', a.unidades?.endereco || a.unidades?.nome || '')
    .replaceAll('[profissional]', a.usuarios?.nome || '')
    .replaceAll('[serviço]', a.servicos?.nome || '')
}
const linkZap = (tipo, a, modelos) => {
  const fone = String(a.clientes?.telefone || '').replace(/\D/g, '')
  if (!fone) return null
  return `https://wa.me/${fone.startsWith('55') && fone.length >= 12 ? fone : '55' + fone}?text=${encodeURIComponent(montarMensagem(modelos[tipo], a))}`
}
function Zaps({ a, modelos }) {
  if (!['agendado', 'confirmado'].includes(a.status)) return null
  const conf = linkZap('confirmacao', a, modelos), lemb = linkZap('lembrete', a, modelos)
  if (!conf) return <small className="vazio">Cliente sem telefone</small>
  return (
    <span className="zaps">
      <a className="zap" href={conf} target="_blank" rel="noreferrer" title="Abrir o WhatsApp com a mensagem de confirmação"><Icone nome="conversa" tam={14} />Confirmar</a>
      <a className="zap" href={lemb} target="_blank" rel="noreferrer" title="Abrir o WhatsApp com a mensagem de lembrete"><Icone nome="conversa" tam={14} />Lembrar</a>
    </span>
  )
}

function Mensagens() {
  const [textos, setTextos] = useState(MODELOS_PADRAO)
  const [aviso, setAviso] = useState('')
  useEffect(() => {
    db.from('mensagens_modelo').select('tipo,texto').then(({ data }) => {
      if (data?.length) setTextos(x => ({ ...x, ...Object.fromEntries(data.map(d => [d.tipo, d.texto])) }))
    })
  }, [])
  const amanha = new Date(); amanha.setDate(amanha.getDate() + 1); amanha.setHours(14, 30, 0, 0)
  const exemplo = { inicio: amanha.toISOString(), clientes: { nome: 'Maria' }, unidades: { endereco: 'Rua das Flores, 123 - Centro' }, usuarios: { nome: 'Greice' }, servicos: { nome: 'Design de sobrancelha' } }
  const inserir = (tipo, campo) => {
    const el = document.getElementById('msg-' + tipo)
    const ini = el?.selectionStart ?? textos[tipo].length, fim = el?.selectionEnd ?? ini
    setTextos({ ...textos, [tipo]: textos[tipo].slice(0, ini) + campo + textos[tipo].slice(fim) })
    el?.focus()
  }
  const salvar = async (tipo, titulo) => {
    const { error } = await db.from('mensagens_modelo').upsert({ tipo, titulo, texto: textos[tipo], atualizado_em: new Date().toISOString() }, { onConflict: 'tipo' })
    setAviso(error ? 'Não foi possível salvar. Confira se a migração do SQL foi executada.' : `Mensagem de ${titulo.toLowerCase()} salva.`)
  }
  return (
    <>
      <h1>Mensagens do WhatsApp</h1>
      <p className="vazio" style={{ marginTop: -6 }}>Esses textos abrem prontos no WhatsApp da cliente, na agenda e no painel. Você só confere e envia.</p>
      {aviso && <p style={{ color: 'var(--rosa-esc)', fontWeight: 500 }}>{aviso}</p>}
      {TIPOS_MSG.map(([tipo, titulo]) => (
        <div key={tipo} className="cartao">
          <h2>{titulo}</h2>
          <textarea id={'msg-' + tipo} rows="6" value={textos[tipo]} onChange={e => setTextos({ ...textos, [tipo]: e.target.value })} />
          <div className="chips-campo">
            <small className="vazio">Inserir:</small>
            {CAMPOS_MSG.map(c => <button key={c} className="leve" style={{ padding: '4px 12px' }} onClick={() => inserir(tipo, c)}>{c}</button>)}
          </div>
          <p className="vazio" style={{ margin: '10px 0 6px' }}>Prévia com um exemplo:</p>
          <div className="balao">{montarMensagem(textos[tipo], exemplo)}</div>
          <button style={{ marginTop: 14 }} onClick={() => salvar(tipo, titulo)}>Salvar mensagem</button>
        </div>
      ))}
    </>
  )
}

async function lancarReceber({ unidade_id, cliente_id, forma_id, descricao, total, parcelas, data, recebido, pacote_cliente_id }) {
  const n = Math.max(1, Number(parcelas) || 1)
  const { data: conta, error } = await db.from('contas_receber').insert({
    unidade_id, cliente_id: cliente_id || null, forma_pagamento_id: forma_id || null,
    pacote_cliente_id: pacote_cliente_id || null, descricao, valor_total: total,
  }).select().single()
  if (error) return error
  const base = Math.floor(total / n * 100) / 100
  const linhas = Array.from({ length: n }, (_, k) => ({
    conta_id: conta.id, numero: k + 1, vencimento: somaMeses(data, k),
    valor: k < n - 1 ? base : Number((total - base * (n - 1)).toFixed(2)),
    ...(recebido && k === 0 ? { status: 'paga', pago_em: isoData(new Date()) } : {}),
  }))
  return (await db.from('parcelas_receber').insert(linhas)).error
}

function Compras() {
  const [aba, setAba] = useState('compras')
  const [ref, setRef] = useState({ unidades: [], fornecedores: [], produtos: [] })
  const [compras, setCompras] = useState([])
  const [estoque, setEstoque] = useState([])
  const [unid, setUnid] = useState('')
  const [form, setForm] = useState(null)
  const [erro, setErro] = useState('')
  const [nf, setNf] = useState('')
  const [np, setNp] = useState({ nome: '', unidade_medida: 'un', estoque_minimo: '' })

  const carregar = async () => {
    const [u, f, p, c, e] = await Promise.all([
      db.from('unidades').select('id,nome').eq('ativa', true).order('nome'),
      db.from('fornecedores').select('*').order('nome'),
      db.from('produtos').select('*').eq('ativo', true).order('nome'),
      db.from('compras').select('*, fornecedores(nome), unidades(nome,cor), itens_compra(quantidade, produtos(nome))').order('data', { ascending: false }).limit(40),
      db.from('estoque').select('*'),
    ])
    setRef({ unidades: u.data || [], fornecedores: f.data || [], produtos: p.data || [] })
    setCompras(c.data || []); setEstoque(e.data || [])
    setUnid(x => x || u.data?.[0]?.id || '')
  }
  useEffect(() => { carregar() }, [])

  const novaCompra = () => setForm({ unidade_id: unid, fornecedor_id: '', itens: [{ produto_id: '', quantidade: '', custo: '' }], gerar: true, vencimento: isoData(somaDias(new Date(), 30)), parcelas: 1 })
  const itemMuda = (k, campo, v) => setForm({ ...form, itens: form.itens.map((it, j) => j === k ? { ...it, [campo]: v } : it) })
  const salvarCompra = async () => {
    const itens = form.itens.filter(i => i.produto_id && Number(i.quantidade) > 0)
    if (!form.unidade_id || itens.length === 0) return setErro('Escolha a unidade e ao menos um produto com quantidade.')
    const total = itens.reduce((t, i) => t + Number(i.quantidade) * Number(i.custo || 0), 0)
    const { data: c, error } = await db.from('compras').insert({ unidade_id: form.unidade_id, fornecedor_id: form.fornecedor_id || null, total }).select().single()
    if (error) return setErro(FALHA)
    const r = await db.from('itens_compra').insert(itens.map(i => ({ compra_id: c.id, produto_id: i.produto_id, quantidade: Number(i.quantidade), custo_unitario: Number(i.custo || 0) })))
    if (r.error) return setErro(FALHA)
    if (form.gerar && total > 0) {
      const n = Math.max(1, Number(form.parcelas) || 1)
      const forn = ref.fornecedores.find(x => x.id === form.fornecedor_id)?.nome
      await db.from('contas_pagar').insert(Array.from({ length: n }, (_, k) => ({
        unidade_id: form.unidade_id, fornecedor_id: form.fornecedor_id || null, compra_id: c.id,
        descricao: `Compra${forn ? ' ' + forn : ''}${n > 1 ? ` (${k + 1}/${n})` : ''}`,
        valor: Number((total / n).toFixed(2)), vencimento: somaMeses(form.vencimento, k),
      })))
    }
    setForm(null); setErro(''); carregar()
  }
  const mudar = async (c, status) => { await db.from('compras').update({ status }).eq('id', c.id); carregar() }
  const ajustar = async (pr, v) => {
    await db.from('estoque').upsert({ produto_id: pr.id, unidade_id: unid, quantidade: Number(v) || 0 }, { onConflict: 'produto_id,unidade_id' })
    carregar()
  }
  const addForn = async () => { if (!nf.trim()) return; await db.from('fornecedores').insert({ nome: nf }); setNf(''); carregar() }
  const addProd = async () => {
    if (!np.nome.trim()) return
    await db.from('produtos').insert({ nome: np.nome, unidade_medida: np.unidade_medida || 'un', estoque_minimo: Number(np.estoque_minimo) || 0 })
    setNp({ nome: '', unidade_medida: 'un', estoque_minimo: '' }); carregar()
  }
  const qtd = pr => Number(estoque.find(e => e.produto_id === pr.id && e.unidade_id === unid)?.quantidade || 0)
  const baixos = ref.produtos.filter(pr => pr.estoque_minimo > 0 && qtd(pr) <= pr.estoque_minimo)

  return (
    <>
      <h1>Compras e estoque</h1>
      <div className="cartao form">
        {[['compras', 'Compras'], ['estoque', 'Estoque'], ['cadastros', 'Produtos e fornecedores']].map(([k, r]) => <button key={k} className={aba === k ? '' : 'leve'} onClick={() => setAba(k)}>{r}</button>)}
        {aba === 'estoque' && <Sel valor={unid} onChange={setUnid} vazio="Unidade" opcoes={ref.unidades.map(u => [u.id, u.nome])} />}
      </div>

      {aba === 'compras' && (
        <>
          <div style={{ marginBottom: 12 }}><button onClick={novaCompra}>Nova compra</button></div>
          {form && (
            <div className="cartao form">
              <Sel valor={form.unidade_id} onChange={v => setForm({ ...form, unidade_id: v })} vazio="Unidade" opcoes={ref.unidades.map(u => [u.id, u.nome])} />
              <Sel valor={form.fornecedor_id} onChange={v => setForm({ ...form, fornecedor_id: v })} vazio="Fornecedor (opcional)" opcoes={ref.fornecedores.map(f => [f.id, f.nome])} />
              {form.itens.map((it, k) => (
                <div key={k} className="form" style={{ width: '100%' }}>
                  <Sel valor={it.produto_id} onChange={v => itemMuda(k, 'produto_id', v)} vazio="Produto" opcoes={ref.produtos.map(x => [x.id, x.nome])} />
                  <input type="number" placeholder="Quantidade" style={{ width: 120 }} value={it.quantidade} onChange={e => itemMuda(k, 'quantidade', e.target.value)} />
                  <input type="number" step="0.01" placeholder="Custo unitário (R$)" style={{ width: 170 }} value={it.custo} onChange={e => itemMuda(k, 'custo', e.target.value)} />
                </div>
              ))}
              <button className="leve" onClick={() => setForm({ ...form, itens: [...form.itens, { produto_id: '', quantidade: '', custo: '' }] })}>Adicionar produto</button>
              <label style={{ width: '100%' }}><input type="checkbox" checked={form.gerar} onChange={e => setForm({ ...form, gerar: e.target.checked })} /> Gerar conta a pagar</label>
              {form.gerar && (
                <>
                  <label>1º vencimento <input type="date" value={form.vencimento} onChange={e => setForm({ ...form, vencimento: e.target.value })} /></label>
                  <input type="number" min="1" placeholder="Parcelas" style={{ width: 100 }} value={form.parcelas} onChange={e => setForm({ ...form, parcelas: e.target.value })} />
                </>
              )}
              <button onClick={salvarCompra}>Salvar compra</button>
              <button className="leve" onClick={() => { setForm(null); setErro('') }}>Cancelar</button>
              {erro && <p className="erro" style={{ width: '100%' }}>{erro}</p>}
            </div>
          )}
          {compras.length === 0 && <p className="vazio">Nenhuma compra registrada. Cadastre antes os produtos na aba "Produtos e fornecedores".</p>}
          {compras.map(c => (
            <div key={c.id} className="cartao linha" style={{ borderLeft: `6px solid ${c.unidades?.cor || '#D4708A'}`, opacity: c.status === 'cancelada' ? .5 : 1 }}>
              <div>
                <strong>{dataBr(c.data + 'T12:00')}</strong> · {c.fornecedores?.nome || 'Sem fornecedor'} · {c.unidades?.nome}<br />
                <small>{c.itens_compra.map(i => `${i.quantidade}× ${i.produtos?.nome}`).join(', ')} · {brl(c.total)} · {c.status === 'pedido' ? 'Pedido feito' : c.status === 'recebida' ? 'Recebida' : 'Cancelada'}</small>
              </div>
              {c.status === 'pedido' && (
                <div className="form">
                  <button onClick={() => mudar(c, 'recebida')}>Marcar como recebida</button>
                  <button className="leve" onClick={() => mudar(c, 'cancelada')}>Cancelar</button>
                </div>
              )}
            </div>
          ))}
        </>
      )}

      {aba === 'estoque' && (
        <>
          {baixos.length > 0 && <p className="erro" style={{ marginBottom: 12 }}>Estoque baixo: {baixos.map(b => b.nome).join(', ')}.</p>}
          {ref.produtos.length === 0 && <p className="vazio">Nenhum produto cadastrado.</p>}
          {ref.produtos.map(pr => (
            <div key={pr.id + unid + qtd(pr)} className="cartao linha" style={{ borderLeft: `6px solid ${pr.estoque_minimo > 0 && qtd(pr) <= pr.estoque_minimo ? '#D4708A' : '#F1DDD6'}` }}>
              <div><strong>{pr.nome}</strong><br /><small>Mínimo: {pr.estoque_minimo} {pr.unidade_medida}</small></div>
              <label>Em estoque <input type="number" style={{ width: 100 }} defaultValue={qtd(pr)} onBlur={e => ajustar(pr, e.target.value)} /> {pr.unidade_medida}</label>
            </div>
          ))}
        </>
      )}

      {aba === 'cadastros' && (
        <>
          <div className="cartao form">
            <input placeholder="Nome do produto" value={np.nome} onChange={e => setNp({ ...np, nome: e.target.value })} />
            <input placeholder="Medida (un, ml, g)" style={{ width: 150 }} value={np.unidade_medida} onChange={e => setNp({ ...np, unidade_medida: e.target.value })} />
            <input type="number" placeholder="Estoque mínimo" style={{ width: 150 }} value={np.estoque_minimo} onChange={e => setNp({ ...np, estoque_minimo: e.target.value })} />
            <button onClick={addProd}>Salvar produto</button>
          </div>
          <div className="cartao form">
            <input placeholder="Nome do fornecedor" value={nf} onChange={e => setNf(e.target.value)} />
            <button onClick={addForn}>Salvar fornecedor</button>
          </div>
          <p className="vazio">Produtos: {ref.produtos.map(x => x.nome).join(', ') || 'nenhum'}.<br />Fornecedores: {ref.fornecedores.map(x => x.nome).join(', ') || 'nenhum'}.</p>
        </>
      )}
    </>
  )
}

function Pacotes() {
  const [pacotes, setPacotes] = useState([])
  const [ref, setRef] = useState({ unidades: [], clientes: [], servicos: [], formas: [] })
  const [vendidos, setVendidos] = useState([])
  const [saldos, setSaldos] = useState([])
  const [fp, setFp] = useState({ nome: '', servico_id: '', sessoes: '', preco: '', validade_dias: '' })
  const [venda, setVenda] = useState({ cliente_id: '', pacote_id: '', unidade_id: '', forma_id: '', parcelas: 1, recebido: true })
  const [pt, setPt] = useState({ cliente_id: '', pontos: '', motivo: '' })
  const [msg, setMsg] = useState('')

  const carregar = async () => {
    const [pa, u, c, sv, fo, vd, sd] = await Promise.all([
      db.from('pacotes').select('*, servicos(nome)').order('nome'),
      db.from('unidades').select('id,nome').eq('ativa', true).order('nome'),
      db.from('clientes').select('id,nome').order('nome'),
      db.from('servicos').select('id,nome').eq('ativo', true).order('nome'),
      db.from('formas_pagamento').select('id,nome').eq('ativa', true).order('nome'),
      db.from('pacotes_cliente').select('*, clientes(nome), pacotes(nome)').gt('sessoes_restantes', 0).order('comprado_em', { ascending: false }),
      db.from('v_saldo_fidelidade').select('*'),
    ])
    setPacotes(pa.data || []); setRef({ unidades: u.data || [], clientes: c.data || [], servicos: sv.data || [], formas: fo.data || [] })
    setVendidos(vd.data || []); setSaldos(sd.data || [])
  }
  useEffect(() => { carregar() }, [])

  const criar = async () => {
    if (!fp.nome.trim() || !(Number(fp.sessoes) > 0) || !(Number(fp.preco) > 0)) return setMsg('Informe nome, número de sessões e preço do pacote.')
    const { error } = await db.from('pacotes').insert({ nome: fp.nome, servico_id: fp.servico_id || null, sessoes: Number(fp.sessoes), preco: Number(fp.preco), validade_dias: Number(fp.validade_dias) || null })
    if (error) return setMsg(FALHA)
    setMsg(''); setFp({ nome: '', servico_id: '', sessoes: '', preco: '', validade_dias: '' }); carregar()
  }
  const vender = async () => {
    const pc = pacotes.find(x => x.id === venda.pacote_id)
    if (!pc || !venda.cliente_id || !venda.unidade_id) return setMsg('Escolha cliente, pacote e unidade.')
    const exp = pc.validade_dias ? isoData(somaDias(new Date(), pc.validade_dias)) : null
    const { data: pcli, error } = await db.from('pacotes_cliente').insert({ cliente_id: venda.cliente_id, pacote_id: pc.id, sessoes_restantes: pc.sessoes, expira_em: exp }).select().single()
    if (error) return setMsg(FALHA)
    const e2 = await lancarReceber({ unidade_id: venda.unidade_id, cliente_id: venda.cliente_id, forma_id: venda.forma_id, descricao: `Pacote ${pc.nome}`, total: Number(pc.preco), parcelas: venda.parcelas, data: isoData(new Date()), recebido: venda.recebido, pacote_cliente_id: pcli.id })
    if (e2) return setMsg('Pacote criado, mas o lançamento financeiro falhou. Registre o valor no Financeiro.')
    await db.from('fidelidade_movimentos').insert({ cliente_id: venda.cliente_id, pontos: Math.floor(Number(pc.preco) * PONTOS_POR_REAL), motivo: `Pacote ${pc.nome}` })
    setMsg(''); setVenda({ ...venda, cliente_id: '', pacote_id: '' }); carregar()
  }
  const usar = async x => { await db.from('pacotes_cliente').update({ sessoes_restantes: x.sessoes_restantes - 1 }).eq('id', x.id); carregar() }
  const mover = async sinal => {
    const n = Math.abs(Number(pt.pontos))
    if (!pt.cliente_id || !(n > 0)) return setMsg('Escolha a cliente e informe os pontos.')
    await db.from('fidelidade_movimentos').insert({ cliente_id: pt.cliente_id, pontos: sinal * n, motivo: pt.motivo || (sinal > 0 ? 'Bônus' : 'Resgate') })
    setMsg(''); setPt({ cliente_id: '', pontos: '', motivo: '' }); carregar()
  }
  const nomeCli = id => ref.clientes.find(c => c.id === id)?.nome || 'Cliente'

  return (
    <>
      <h1>Pacotes e fidelidade</h1>
      {msg && <p className="erro" style={{ marginBottom: 12 }}>{msg}</p>}
      <h2>Pacotes à venda</h2>
      <div className="cartao form">
        <input placeholder="Nome (ex.: 5 limpezas de pele)" value={fp.nome} onChange={e => setFp({ ...fp, nome: e.target.value })} />
        <Sel valor={fp.servico_id} onChange={v => setFp({ ...fp, servico_id: v })} vazio="Serviço" opcoes={ref.servicos.map(x => [x.id, x.nome])} />
        <input type="number" placeholder="Sessões" style={{ width: 100 }} value={fp.sessoes} onChange={e => setFp({ ...fp, sessoes: e.target.value })} />
        <input type="number" step="0.01" placeholder="Preço (R$)" style={{ width: 130 }} value={fp.preco} onChange={e => setFp({ ...fp, preco: e.target.value })} />
        <input type="number" placeholder="Validade (dias)" style={{ width: 140 }} value={fp.validade_dias} onChange={e => setFp({ ...fp, validade_dias: e.target.value })} />
        <button onClick={criar}>Criar pacote</button>
      </div>
      <p className="vazio">{pacotes.length === 0 ? 'Nenhum pacote criado.' : pacotes.map(x => `${x.nome} (${x.sessoes} sessões, ${brl(x.preco)})`).join(' · ')}</p>

      <h2 style={{ marginTop: 28 }}>Vender pacote</h2>
      <div className="cartao form">
        <Sel valor={venda.cliente_id} onChange={v => setVenda({ ...venda, cliente_id: v })} vazio="Cliente" opcoes={ref.clientes.map(c => [c.id, c.nome])} />
        <Sel valor={venda.pacote_id} onChange={v => setVenda({ ...venda, pacote_id: v })} vazio="Pacote" opcoes={pacotes.filter(x => x.ativo).map(x => [x.id, x.nome])} />
        <Sel valor={venda.unidade_id} onChange={v => setVenda({ ...venda, unidade_id: v })} vazio="Unidade" opcoes={ref.unidades.map(u => [u.id, u.nome])} />
        <Sel valor={venda.forma_id} onChange={v => setVenda({ ...venda, forma_id: v })} vazio="Forma de pagamento" opcoes={ref.formas.map(f => [f.id, f.nome])} />
        <input type="number" min="1" placeholder="Parcelas" style={{ width: 100 }} value={venda.parcelas} onChange={e => setVenda({ ...venda, parcelas: e.target.value })} />
        <label><input type="checkbox" checked={venda.recebido} onChange={e => setVenda({ ...venda, recebido: e.target.checked })} /> Primeira parcela já recebida</label>
        <button onClick={vender}>Vender e lançar no financeiro</button>
      </div>

      <h2 style={{ marginTop: 28 }}>Pacotes em andamento</h2>
      {vendidos.length === 0 && <p className="vazio">Nenhum pacote com sessões restantes.</p>}
      {vendidos.map(x => (
        <div key={x.id} className="cartao linha">
          <div><strong>{x.clientes?.nome}</strong> · {x.pacotes?.nome}<br /><small>{x.sessoes_restantes} sessão(ões) restante(s){x.expira_em && ` · vale até ${dataBr(x.expira_em + 'T12:00')}`}</small></div>
          <button onClick={() => usar(x)}>Usar 1 sessão</button>
        </div>
      ))}

      <h2 style={{ marginTop: 28 }}>Fidelidade</h2>
      <p className="vazio">Cada R$ 1 pago vale {PONTOS_POR_REAL} ponto (ao registrar o pagamento de um atendimento ou vender um pacote).</p>
      <div className="cartao form">
        <Sel valor={pt.cliente_id} onChange={v => setPt({ ...pt, cliente_id: v })} vazio="Cliente" opcoes={ref.clientes.map(c => [c.id, c.nome])} />
        <input type="number" placeholder="Pontos" style={{ width: 110 }} value={pt.pontos} onChange={e => setPt({ ...pt, pontos: e.target.value })} />
        <input placeholder="Motivo (opcional)" value={pt.motivo} onChange={e => setPt({ ...pt, motivo: e.target.value })} />
        <button onClick={() => mover(1)}>Dar pontos</button>
        <button className="leve" onClick={() => mover(-1)}>Resgatar pontos</button>
      </div>
      {saldos.length === 0 && <p className="vazio">Ainda não há pontos acumulados.</p>}
      {[...saldos].sort((a, b) => b.pontos - a.pontos).map(x => (
        <div key={x.cliente_id} className="cartao linha"><strong>{nomeCli(x.cliente_id)}</strong><span className="numero">{x.pontos} pts</span></div>
      ))}
    </>
  )
}

function Barras({ itens }) {
  const max = Math.max(1, ...itens.map(i => i[1]))
  return itens.map(([rotulo, valor, texto]) => (
    <div key={rotulo} className="barra"><span>{rotulo}</span><div className="trilho"><div style={{ width: `${valor / max * 100}%` }} /></div><strong>{texto}</strong></div>
  ))
}

function Relatorios() {
  const hoje = new Date()
  const [mes, setMes] = useState(new Date(hoje.getFullYear(), hoje.getMonth(), 1))
  const [unid, setUnid] = useState('')
  const [unidades, setUnidades] = useState([])
  const [atend, setAtend] = useState([])
  const [fat, setFat] = useState([])
  useEffect(() => { db.from('unidades').select('id,nome').order('nome').then(({ data }) => setUnidades(data || [])) }, [])
  useEffect(() => {
    const prox = new Date(mes.getFullYear(), mes.getMonth() + 1, 1)
    db.from('agendamentos').select('unidade_id, servicos(nome), clientes(nome), usuarios(nome)').eq('status', 'concluido')
      .gte('inicio', mes.toISOString()).lt('inicio', prox.toISOString()).then(({ data }) => setAtend(data || []))
    db.from('v_faturamento_mensal').select('*').gte('mes', isoData(new Date(mes.getFullYear(), mes.getMonth() - 5, 1))).lte('mes', isoData(mes))
      .then(({ data }) => setFat(data || []))
  }, [mes])
  const A = atend.filter(i => !unid || i.unidade_id === unid)
  const ranking = f => Object.entries(A.reduce((m, i) => { const k = f(i) || 'Sem nome'; m[k] = (m[k] || 0) + 1; return m }, {})).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, v]) => [k, v, String(v)])
  const meses = Array.from({ length: 6 }, (_, k) => new Date(mes.getFullYear(), mes.getMonth() - 5 + k, 1))
  const porMes = meses.map(m => {
    const v = fat.filter(f => f.mes === isoData(m) && (!unid || f.unidade_id === unid)).reduce((t, f) => t + Number(f.total), 0)
    return [m.toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' }), v, brl(v)]
  })
  return (
    <>
      <h1>Relatórios</h1>
      <div className="cartao form">
        <button className="leve" onClick={() => setMes(new Date(mes.getFullYear(), mes.getMonth() - 1, 1))}>Mês anterior</button>
        <strong style={{ textTransform: 'capitalize' }}>{mes.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}</strong>
        <button className="leve" onClick={() => setMes(new Date(mes.getFullYear(), mes.getMonth() + 1, 1))}>Próximo mês</button>
        <Sel valor={unid} onChange={setUnid} vazio="Todas as unidades" opcoes={unidades.map(u => [u.id, u.nome])} />
      </div>
      <div className="resumo" style={{ marginBottom: 14 }}>
        <div className="cartao"><small>Atendimentos concluídos</small><div className="numero">{A.length}</div></div>
        <div className="cartao"><small>Faturamento recebido no mês</small><div className="numero">{porMes[5][2]}</div></div>
      </div>
      <div className="cartao"><h2>Faturamento dos últimos 6 meses</h2><Barras itens={porMes} /></div>
      <div className="cartao"><h2>Serviços mais realizados</h2>{A.length === 0 ? <p className="vazio">Sem atendimentos concluídos neste mês.</p> : <Barras itens={ranking(i => i.servicos?.nome)} />}</div>
      <div className="cartao"><h2>Clientes mais frequentes</h2>{A.length === 0 ? <p className="vazio">Sem atendimentos concluídos neste mês.</p> : <Barras itens={ranking(i => i.clientes?.nome)} />}</div>
      <div className="cartao"><h2>Atendimentos por profissional</h2>{A.length === 0 ? <p className="vazio">Sem atendimentos concluídos neste mês.</p> : <Barras itens={ranking(i => i.usuarios?.nome)} />}</div>
    </>
  )
}
